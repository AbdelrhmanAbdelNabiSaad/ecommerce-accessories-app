<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/login.css" />
  </head>
  <body>
    <!-- Start Navbar -->
     <nav class="navbar md:navbar-expand bg-1">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">
        <img src="./img/E__3_-removebg-preview.png" alt="Logo" height="80">
    </a>
  </div>
</nav>
    <!-- End Navbar -->
     <!-- Start Login Form -->
      <div class="container mt-10">
        <div class="login-container">
            <form id="loginForm">
                <div class="form-field">
              <label for="email" class="form-label">Email</label>
              <input
                type="email"
                id="email"
                class="form-control"
                placeholder="Enter Email"
              />
            </div>
                <div class="form-field mt-5">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                id="password"
                class="form-control"
                placeholder="Enter Password"
              />
            </div>
            <button type="button" onclick="login()" class="mt-10 btn btn-solid btn-styled theme-warning">
            Login
          </button>
                    <p class="mt-5 fg-white">Don't have an account? <a href="./register.html" class="fg-warning text-decoration-none">Register</a></p>

            </form>
        </div>
      </div>
      <!-- End Login Form -->
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
    <script src="./js/main.js"></script>
  </body>
</html>
