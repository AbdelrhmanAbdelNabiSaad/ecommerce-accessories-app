    <title>E-Commerce - JS</title>

    <!-- Start Navbar -->
    <nav class="navbar md:navbar-expand bg-1">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">
          <img src="./img/E__3_-removebg-preview.png" alt="logo" height="80" />
        </a>
        <div class="ms-auto">
          <button
            class="btn btn-solid theme-warning"
            onclick="redirectTo('./login.html')"
          >
            Login
          </button>
          <button
            class="btn btn-outline theme-warning"
            onclick="redirectTo('./register.html')"
          >
            Register
          </button>
        </div>
      </div>
    </nav>
    <!-- End Navbar -->
    <!-- Start Search -->
    <div class="container mt-10">
      <div class="row gap-5">
        <div class="col-3">
          <div class="form-field">
            <select class="form-control" id="searchType">
              <option hidden>Search Product</option>
              <option value="name">Search by Product Name</option>
              <option value="category">Search by Product Category</option>
            </select>
          </div>
        </div>
        <div class="col-6">
          <div class="form-field">
            <input
              type="text"
              id="searchBox"
              placeholder="Search Product Name or Category"
              class="form-control"
            />
          </div>
        </div>
        <div class="col-2">
          <button class="btn btn-solid theme-warning w-100" onclick="searchProducts()">Search</button>
        </div>
      </div>
    </div>
    <!-- End Search -->

    <div class="container container-products mt-10" id="products-container">
